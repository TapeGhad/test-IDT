server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css;

    location / {
        try_files $uri $uri/ =404;
        # File names carry no content hash, so browsers must revalidate (a cheap 304 via ETag)
        # instead of guessing how long a cached bundle stays fresh.
        add_header Cache-Control "no-cache";
    }
}
